name: LADS CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: LADS CI / ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install exact engineering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lads.txt
      - name: Check out separately pinned public product test subject
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/dabinglei2-hash/LifeOS.git "${RUNNER_TEMP}/lifeos-product"
          product_sha="${{ vars.LIFEOS_PRODUCT_QA_SHA }}"
          [[ "$product_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: set independently accepted LIFEOS_PRODUCT_QA_SHA; no stale fallback."; exit 1; }
          git -C "${RUNNER_TEMP}/lifeos-product" checkout "$product_sha"
      - name: Validate engineering and cross-repository QA contracts
        run: python -B scripts/validate_devteam.py --product-root "${RUNNER_TEMP}/lifeos-product" --workspace "${RUNNER_TEMP}/LADS-Workspace"
